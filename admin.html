<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSS Admin Dashboard</title><style>
:root{--red:#b5122b;--ink:#172033;--muted:#64748b;--line:#e5eaf1;--bg:#f4f6fb;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}header{background:#101827;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:1.05rem}a{color:inherit;text-decoration:none}.shell{max-width:1300px;margin:auto;padding:24px}.login{max-width:420px;margin:8vh auto;background:white;padding:28px;border:1px solid var(--line);border-radius:20px;box-shadow:0 15px 50px #18233810}.login h1{margin-top:0}.hidden{display:none!important}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-weight:750;font-size:.88rem}.field input,.field textarea,.field select{font:inherit;border:1px solid #cfd7e4;border-radius:9px;padding:10px 11px;background:white;color:var(--ink);width:100%}.field textarea{min-height:86px;resize:vertical}.btn{border:0;border-radius:9px;background:var(--red);color:white;font-weight:800;padding:10px 15px;cursor:pointer}.btn.secondary{background:#e9edf5;color:#263247}.btn.danger{background:#fff0f2;color:#a30e27}.btn:disabled{opacity:.5}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}.side{background:white;border:1px solid var(--line);border-radius:16px;padding:12px;height:max-content;position:sticky;top:16px}.side button{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:9px;font:inherit;font-weight:700;color:#42506a;cursor:pointer}.side button.active,.side button:hover{background:#fff0f3;color:var(--red)}.topline{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.topline h1{margin:0;font-size:1.65rem}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:1.8rem;margin-top:4px}.cols{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.5fr);gap:16px;align-items:start}.panel h2{font-size:1.05rem;margin:0 0 14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#667085;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}td .btn{padding:6px 8px;font-size:.8rem;margin:2px}.msg{padding:10px 12px;border-radius:9px;background:#e9f8ef;color:#12643b;margin:12px 0}.error{background:#fff0f2;color:#a30e27}.hint{color:var(--muted);font-size:.88rem}.check{display:flex;align-items:center;gap:8px;margin:10px 0}.check input{width:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:.75rem;background:#edf1f7;padding:3px 7px;border-radius:99px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.side button{white-space:nowrap;width:auto}.cols{grid-template-columns:1fr}.shell{padding:14px}header{padding:16px}}
</style></head><body><header><strong>VSS · Administration Console</strong><div style="display:flex;gap:14px;align-items:center"><a href="/portal.html">View public portal ↗</a><button id="logout" class="btn secondary hidden">Log out</button></div></header>
<section id="loginPanel" class="login"><h1>Admin sign in</h1><p class="hint">Use the administrator email and password configured in the server environment.</p><form id="loginForm"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Sign in securely</button><div id="loginMsg"></div></form></section>
<main id="appPanel" class="shell hidden"><div class="layout"><aside class="side" id="nav"><button data-view="overview" class="active">Overview</button><button data-view="profiles">Member profiles</button><button data-view="departments">Departments</button><button data-view="notices">Notices</button><button data-view="events">Events</button><button data-view="memberships">Membership applications</button><button data-view="helpdesk">Helpdesk</button></aside><section><div class="topline"><div><h1 id="viewTitle">Overview</h1><div class="hint" id="viewHint">VSS portal management</div></div><button id="refresh" class="btn secondary">Refresh data</button></div><div id="message"></div><div id="content"></div></section></div></main>
<script>
let token=sessionStorage.getItem('vss_admin_token')||'';let view='overview';let records=[];let editing=null;let departments=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch('/api/'+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok){if(r.status===401){logout()}throw new Error(data.message||'Request failed')}return data}
function say(msg,error=false){$('message').innerHTML=msg?`<div class="msg ${error?'error':''}">${esc(msg)}</div>`:''}
function showApp(){ $('loginPanel').classList.toggle('hidden',!!token);$('appPanel').classList.toggle('hidden',!token);$('logout').classList.toggle('hidden',!token);if(token)loadView(view)}function logout(){token='';sessionStorage.removeItem('vss_admin_token');showApp()}
$('logout').onclick=logout;$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').innerHTML='';try{const r=await api('admin/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=r.token;sessionStorage.setItem('vss_admin_token',token);showApp()}catch(err){$('loginMsg').innerHTML=`<div class="msg error">${esc(err.message)}</div>`}};
$('nav').onclick=e=>{const b=e.target.closest('button[data-view]');if(!b)return;view=b.dataset.view;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));loadView(view)};$('refresh').onclick=()=>loadView(view);
const titles={overview:'Overview',profiles:'Member profiles',departments:'Departments',notices:'Notices',events:'Events',memberships:'Membership applications',helpdesk:'Helpdesk requests'};
async function loadView(v){view=v;editing=null;$('viewTitle').textContent=titles[v];$('viewHint').textContent=v==='overview'?'Current portal activity and records':'Create, update and manage VSS portal content';say('');$('content').innerHTML='<div class="panel">Loading…</div>';try{if(v==='overview'){const d=(await api('admin/overview')).data;overview(d);return}const endpoints={profiles:'admin/profiles',departments:'admin/departments',notices:'admin/notices',events:'admin/events',memberships:'admin/memberships',helpdesk:'admin/helpdesk'};const res=await api(endpoints[v]);records=res.data||[];if(v==='profiles'||v==='departments')departments=(v==='departments'?records:(await api('admin/departments')).data);renderManager(v)}catch(e){$('content').innerHTML=`<div class="panel">${esc(e.message)}</div>`}}
function overview(d){$('content').innerHTML=`<div class="stats">${[['Applications',d.applications],['Pending applications',d.pendingApplications],['Open helpdesk',d.helpdeskOpen],['Published & draft profiles',d.profiles],['Departments',d.departments],['Notices',d.notices],['Events',d.events]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="panel"><h2>Getting started</h2><p>Use the sections to publish member profiles, manage departments, announce notices, and add events. Only content marked as published is shown on the public portal.</p><p class="hint">Keep public contact details consent-based. Never add private student data to public profiles.</p></div>`}
const schemas={departments:[['name','Department name','text',true],['description','Description','textarea'],['head_name','Department lead','text'],['contact_email','Public contact email','email']],profiles:[['name','Full name','text',true],['role','Role / designation','text',true],['department_id','Department','select'],['semester','Semester / year','text'],['bio','Short bio','textarea'],['photo_url','Photo URL (optional)','url'],['contact_public','Public email (optional)','email'],['published','Publish profile','check']],notices:[['title','Notice title','text',true],['body','Notice content','textarea',true],['category','Category','text'],['publish_date','Publication date','date'],['pinned','Pin notice','check'],['published','Publish publicly','check']],events:[['title','Event title','text',true],['description','Description','textarea'],['venue','Venue','text'],['starts_at','Start date & time','datetime-local',true],['ends_at','End date & time','datetime-local'],['status','Status','selectStatus'],['image_url','Image URL (optional)','url'],['published','Publish event','check']]};
function formFor(v){const fields=schemas[v];if(!fields)return '';return `<div class="panel"><h2>${editing?'Edit':'Add'} ${v==='profiles'?'member profile':v.slice(0,-1)}</h2><form id="entityForm">${fields.map(([key,label,type,required])=>{let val=editing?editing[key]:'';if(type==='select')return `<div class="field"><label>${label}</label><select name="${key}"><option value="">No department</option>${departments.map(d=>`<option value="${d.id}" ${String(val)===String(d.id)?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>`;if(type==='selectStatus')return `<div class="field"><label>${label}</label><select name="${key}">${['upcoming','ongoing','completed','cancelled'].map(x=>`<option ${val===x?'selected':''}>${x}</option>`).join('')}</select></div>`;if(type==='check')return `<label class="check"><input type="checkbox" name="${key}" ${editing?val?'checked':'':(key==='published'&&v!=='profiles')?'checked':''}> ${label}</label>`;if(type==='textarea')return `<div class="field"><label>${label}</label><textarea name="${key}" ${required?'required':''}>${esc(val)}</textarea></div>`;if(type==='datetime-local'&&val)val=String(val).replace(' ','T').slice(0,16);return `<div class="field"><label>${label}</label><input type="${type}" name="${key}" value="${esc(val)}" ${required?'required':''}></div>`}).join('')}<div class="actions"><button class="btn" type="submit">${editing?'Save changes':'Create'}</button><button class="btn secondary" type="button" id="cancelEdit">Clear</button></div></form></div>`}
function renderManager(v){if(schemas[v]){$('content').innerHTML=`<div class="cols">${formFor(v)}<div class="panel"><h2>Saved ${titles[v].toLowerCase()}</h2>${tableFor(v)}</div></div>`;$('entityForm').onsubmit=saveEntity;$('cancelEdit').onclick=()=>{editing=null;renderManager(v)};return}$('content').innerHTML=`<div class="panel"><h2>${titles[v]}</h2>${tableFor(v)}</div>`}
function tableFor(v){if(!records.length)return '<p class="hint">No records found.</p>';const columns={departments:['name','description','head_name'],profiles:['name','role','department','semester','published'],notices:['title','category','publish_date','pinned','published'],events:['title','venue','starts_at','status','published'],memberships:['name','phone','department','year','status','created_at'],helpdesk:['name','category','message','status','created_at']}[v];return `<div class="tablewrap"><table><thead><tr>${columns.map(c=>`<th>${esc(c.replace('_',' '))}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${records.map(r=>`<tr>${columns.map(c=>`<td>${c==='published'||c==='pinned'?`<span class="badge">${r[c]?'Yes':'No'}</span>`:esc((r[c]??'').toString().slice(0,180))}</td>`).join('')}<td><div class="actions">${schemas[v]?`<button class="btn secondary" data-edit="${r.id}">Edit</button><button class="btn danger" data-delete="${r.id}">Delete</button>`:statusControl(v,r)}</div></td></tr>`).join('')}</tbody></table></div>`}
function statusControl(v,r){if(v==='memberships')return `<select data-status="${r.id}" aria-label="Application status">${['pending','approved','rejected','contacted'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn secondary" data-save-status="${r.id}">Save</button>`;if(v==='helpdesk')return `<select data-status="${r.id}" aria-label="Request status">${['open','in_progress','resolved','closed'].map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn secondary" data-save-status="${r.id}">Save</button>`;return ''}
async function saveEntity(e){e.preventDefault();const v=view;const data={};for(const f of new FormData(e.target).entries())data[f[0]]=f[1];for(const f of e.target.querySelectorAll('input[type=checkbox]'))data[f.name]=f.checked; if(data.department_id)data.department_id=Number(data.department_id);if(data.published!==undefined)data.published=!!data.published;if(data.pinned!==undefined)data.pinned=!!data.pinned;if(v==='events'){if(data.starts_at)data.starts_at=data.starts_at.replace('T',' ');if(data.ends_at)data.ends_at=data.ends_at.replace('T',' ')}try{await api(`admin/${v}${editing?'/'+editing.id:''}`,{method:editing?'PATCH':'POST',body:JSON.stringify(data)});editing=null;say('Saved successfully.');await loadView(v)}catch(err){say(err.message,true)}}
$('content').onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]'),save=e.target.closest('[data-save-status]');try{if(edit){editing=records.find(x=>x.id===Number(edit.dataset.edit));renderManager(view)}else if(del){if(!confirm('Delete this record? This cannot be undone.'))return;await api(`admin/${view}/${del.dataset.delete}`,{method:'DELETE'});say('Record deleted.');loadView(view)}else if(save){const id=save.dataset.saveStatus;const status=document.querySelector(`[data-status="${id}"]`).value;const endpoint=view==='memberships'?`admin/memberships/${id}/status`:`admin/helpdesk/${id}/status`;await api(endpoint,{method:'PATCH',body:JSON.stringify({status})});say('Status updated.');loadView(view)}}catch(err){say(err.message,true)}};
showApp();
</script></body></html>
